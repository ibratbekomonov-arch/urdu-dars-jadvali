<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UrDU — Interaktiv dars jadvali</title><style>html,body{margin:0;background:#07101b;color:#eaf3ff;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}.load{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}.box{max-width:620px;border:1px solid #263b56;background:#0d1828;border-radius:18px;padding:28px}.spin{width:42px;height:42px;border:4px solid #24405f;border-top-color:#69a5ff;border-radius:50%;margin:0 auto 16px;animation:r 1s linear infinite}@keyframes r{to{transform:rotate(360deg)}}small{color:#91abc8}</style></head><body><div class="load"><div class="box"><div class="spin"></div><h2>Dars jadvali yuklanmoqda…</h2><small>UrDU · Intellektual ilmlar va texnologiyalar fakulteti</small><p id="err"></p></div></div><script>(async()=>{try{const parts=await Promise.all(['app1.txt','app2.txt','app3.txt'].map(x=>fetch(x,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(x+' yuklanmadi');return r.text()})));const b64=parts.join('').replace(/\s/g,'');const bin=atob(b64);const bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);if(!('DecompressionStream'in window))throw new Error('Brauzer gzip ochishni qo‘llamaydi. Chrome yoki Edge ishlating.');const ds=new DecompressionStream('gzip');const stream=new Blob([bytes]).stream().pipeThrough(ds);const html=await new Response(stream).text();document.open();document.write(html);document.close()}catch(e){document.getElementById('err').textContent='Xatolik: '+e.message}})();</script></body></html>
